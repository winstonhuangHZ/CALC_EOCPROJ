name: 🐍 Python 混乱制造者 (Modern Bot)

on:
  workflow_dispatch: # 允许在 GitHub 网页上点按钮手动触发

jobs:
  obfuscate-python:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 2. 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 现代 Python 环境

    - name: 3. 安装现代混淆工具
      run: |
        python -m pip install --upgrade pip
        pip install python-obfuscator

    - name: 4. 创建并切换到抽象分支
      run: |
        BRANCH_NAME="abstract-python-${{ github.run_number }}"
        git checkout -b $BRANCH_NAME
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

    - name: 5. 施展魔法：全盘混淆 Python 代码
      # python-obfuscator 会把所有的变量和函数变成极其离谱的字符串
      run: |
        find . -type f -name "*.py" ! -path "*/.*" | while read file; do
          echo "正在对 $file 进行降维打击..."
          # 使用 python-obfuscator 命令行工具处理文件
          pyobfuscate -i "$file"
        done

    - name: 6. 机器人自动 Push 抽象分支
      run: |
        git config --global user.name "Cyber-Python-Chaos-Bot"
        git config --global user.email "python-chaos@example.com"
        
        git add .
        if ! git diff-index --quiet HEAD --; then
          git commit -m "🤖 警告：该分支的 Python 代码已被彻底抽象化，但它还能跑！"
          git push origin ${{ env.BRANCH_NAME }}
        else
          echo "没有找到可以混淆的 Python 文件。"
        fi